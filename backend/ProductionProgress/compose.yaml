services:

  # ==========================================================
  # PostgreSQL
  # ==========================================================
  db:
    image: postgres:16

    container_name: production-progress-db

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    # PostgreSQLが接続可能な状態になっているか確認する。
    # APIをDBより先に起動してしまう問題を防ぐために使用する。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d production_progress"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  # ==========================================================
  # ASP.NET Core Web API
  # ==========================================================
  api:

    # 同じフォルダにあるDockerfileを使って
    # APIのDockerイメージを作成する。
    build:
      context: .
      dockerfile: Dockerfile

    container_name: production-progress-api

    environment:

      # Developmentにしておくことで、
      # 開発環境用の設定やSwaggerを利用する。
      ASPNETCORE_ENVIRONMENT: Development

      # appsettings.json の
      # ConnectionStrings:DefaultConnection を上書きする。
      #
      # Dockerコンテナ間通信ではlocalhostではなく、
      # Composeのサービス名「db」をホスト名として使用する。
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=production_progress;Username=postgres;Password=postgres"

      # JWT設定
      # 「__」はASP.NET Coreでは「:」として扱われる
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__ExpirationMinutes: ${JWT_EXPIRATION_MINUTES}

      # 初期管理者
      InitialAdmin__Username: ${INITIAL_ADMIN_USERNAME}
      InitialAdmin__Password: ${INITIAL_ADMIN_PASSWORD}

    # PCの8080番ポート
    #      ↓
    # APIコンテナの8080番ポート
    ports:
      - "8080:8080"

    # PostgreSQLが起動しただけではなく、
    # 接続可能なHealthy状態になってからAPIを起動する。
    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped


  # ==========================================================
  # Next.js
  # ==========================================================
  frontend:

    # Next.jsプロジェクトフォルダを
    # Dockerのビルドコンテキストにする。
    build:
      context: ../../frontend/production-progress-web
      dockerfile: Dockerfile
      args:
        # ブラウザからAPIへアクセスするためのURL。
        # NEXT_PUBLIC_*なのでNext.jsのビルド時に渡す。
        NEXT_PUBLIC_API_URL: http://localhost:8080

    container_name: production-progress-frontend

    environment:

      # Next.jsサーバーからASP.NET Core APIへ接続する。
      #
      # Dockerコンテナ間通信ではlocalhostではなく、
      # Composeのサービス名「api」を使用する。
      API_BASE_URL: http://api:8080

      # Next.jsを本番モードで実行する。
      NODE_ENV: production

    # PCの3000番ポート
    #      ↓
    # Next.jsコンテナの3000番ポート
    ports:
      - "3000:3000"

    # APIコンテナを先に起動する。
    #
    # ここではAPIにhealthcheckを設定していないので、
    # 「コンテナが起動した」ことだけを条件にする。
    depends_on:
      - api

    restart: unless-stopped


# ============================================================
# PostgreSQLデータ保存用Volume
# ============================================================
volumes:
  postgres_data: